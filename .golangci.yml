version: "2"

linters:
  default: standard        # errcheck, govet, ineffassign, staticcheck, unused
  enable:
    - bodyclose            # http.Response.Body selalu ditutup
    - contextcheck         # ctx diteruskan, bukan context.Background() di tengah jalan
    - errorlint            # errors.Is/As, bukan == atau type assertion
    - gocritic
    - gosec                # SQL string concat, crypto lemah, dsb.
    - misspell
    - noctx                # request HTTP tanpa context
    - revive
    - rowserrcheck         # rows.Err() diperiksa
    - sqlclosecheck        # rows/stmt ditutup
  settings:
    gosec:
      excludes:
        - G404             # math/rand di test boleh
    revive:
      rules:
        - name: exported
          disabled: true   # komentar godoc wajib tidak dipaksakan di Fase 1
  exclusions:
    presets:
      - std-error-handling
    paths:
      - test/load

formatters:
  enable:
    - gofmt
    - goimports
