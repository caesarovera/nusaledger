services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: nusaledger-api
    environment:
      ADDR: ":8080"
      APP_ENV: development
      LOG_LEVEL: info
      # di dalam jaringan compose, host-nya adalah nama service dan port container (5432)
      DATABASE_URL: postgres://nusa:nusa_dev_only@postgres:5432/nusaledger?sslmode=disable
      # DEV SAJA. Di produksi: secret manager, minimal 32 byte acak.
      JWT_SECRET: dev-only-secret-ganti-di-produksi-minimal-32-byte
      RUN_MIGRATIONS: "true"
      DRIFT_CHECK_INTERVAL: 30s
    ports:
      # Host 8081 → container 8080. Port 8080 di mesin dev sudah dipakai layanan lain (laragon).
      - "8081:8080"
    depends_on:
      postgres:
        condition: service_healthy   # tunggu pg_isready, bukan sleep
    restart: unless-stopped

  postgres:
    image: postgres:17-alpine
    container_name: nusaledger-postgres
    environment:
      POSTGRES_USER: nusa
      POSTGRES_PASSWORD: nusa_dev_only
      POSTGRES_DB: nusaledger
    ports:
      # Host 5433 → container 5432. Port 5432 di mesin dev sudah dipakai PostgreSQL lokal (laragon).
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    command:
      - "postgres"
      - "-c" # query > 200 ms tercatat sejak hari pertama
      - "log_min_duration_statement=200ms"
      - "-c" # transaksi menggantung (lupa commit) dibunuh setelah 60 s agar tidak menahan kunci akun
      - "idle_in_transaction_session_timeout=60000"
      - "-c" # query nyangkut tidak boleh menahan koneksi selamanya
      - "statement_timeout=30000"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nusa -d nusaledger"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
