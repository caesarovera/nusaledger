services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: nusaledger-api
    environment:
      ADDR: ":8080"
      APP_ENV: development
      LOG_LEVEL: info
      # Runtime WAJIB peran terbatas nusaledger_app (migration 000011) — tidak punya hak
      # UPDATE/DELETE pada entries, sekalipun ada bug kode. Migrasi jalan sebagai owner
      # 'nusa' lewat MIGRATION_DATABASE_URL, terpisah — nusaledger_app tidak bisa CREATE TABLE.
      DATABASE_URL: postgres://nusaledger_app:app_dev_only_ganti_di_produksi@postgres:5432/nusaledger?sslmode=disable
      MIGRATION_DATABASE_URL: postgres://nusa:nusa_dev_only@postgres:5432/nusaledger?sslmode=disable
      # DEV SAJA. Di produksi: secret manager, minimal 32 byte acak.
      JWT_SECRET: dev-only-secret-ganti-di-produksi-minimal-32-byte
      RUN_MIGRATIONS: "true"
      DRIFT_CHECK_INTERVAL: 30s
      # REDIS_URL diisi → rate limiter Redis (konsisten lintas instance); di compose ini
      # hanya SATU instance api, jadi manfaatnya baru terasa saat di-scale (`--scale api=N`)
      # — tapi diisi dari sekarang supaya jalur produksi diuji, bukan hanya jalur dev "aman".
      REDIS_URL: redis://redis:6379/0
    ports:
      # Host 8081 → container 8080. Port 8080 di mesin dev sudah dipakai layanan lain (laragon).
      # Terikat 127.0.0.1 saja (temuan audit F-2): tanpa ini, port terbuka ke seluruh
      # LAN/Wi-Fi, bukan hanya localhost — meski hanya untuk pengembangan.
      - "127.0.0.1:8081:8080"
    depends_on:
      postgres:
        condition: service_healthy   # tunggu pg_isready, bukan sleep
      redis:
        condition: service_healthy
    restart: unless-stopped

  worker:
    build:
      context: .
      dockerfile: Dockerfile.worker
    container_name: nusaledger-worker
    environment:
      LOG_LEVEL: info
      # Worker JUGA connect sebagai nusaledger_app (peran terbatas) — hanya menyentuh
      # outbox_events & processed_events, tidak pernah entries langsung.
      DATABASE_URL: postgres://nusaledger_app:app_dev_only_ganti_di_produksi@postgres:5432/nusaledger?sslmode=disable
      RABBITMQ_URL: amqp://nusa:nusa_dev_only@rabbitmq:5672/
      RELAY_INTERVAL: 1s
      # TIDAK RUN_MIGRATIONS di sini: api sudah menjalankannya. Dua proses migrasi
      # bersamaan tidak berbahaya (advisory lock golang-migrate) tapi tidak perlu.
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: nusaledger-redis
    command: ["redis-server", "--save", "", "--appendonly", "no"] # rate limit boleh hilang saat restart, bukan data yang harus tahan
    ports:
      # Dev-only, tanpa password (F-2: diikat 127.0.0.1, bukan LAN/Wi-Fi).
      - "127.0.0.1:6380:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  rabbitmq:
    image: rabbitmq:4-management-alpine
    container_name: nusaledger-rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: nusa
      RABBITMQ_DEFAULT_PASS: nusa_dev_only
    ports:
      # 5672 AMQP, 15672 UI management — keduanya dev-only, diikat loopback (F-2).
      - "127.0.0.1:5673:5672"
      - "127.0.0.1:15673:15672"
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "check_port_connectivity"]
      interval: 5s
      timeout: 5s
      retries: 10

  postgres:
    image: postgres:17-alpine
    container_name: nusaledger-postgres
    environment:
      POSTGRES_USER: nusa
      POSTGRES_PASSWORD: nusa_dev_only
      POSTGRES_DB: nusaledger
    ports:
      # Host 5433 → container 5432. Port 5432 di mesin dev sudah dipakai PostgreSQL lokal (laragon).
      # Terikat 127.0.0.1 saja (temuan audit F-2): Postgres ini pakai password dev yang
      # sama untuk semua orang yang menjalankan repo ini — jangan biarkan terjangkau LAN/Wi-Fi.
      - "127.0.0.1:5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    command:
      - "postgres"
      - "-c" # query > 200 ms tercatat sejak hari pertama
      - "log_min_duration_statement=200ms"
      - "-c" # transaksi menggantung (lupa commit) dibunuh setelah 60 s agar tidak menahan kunci akun
      - "idle_in_transaction_session_timeout=60000"
      - "-c" # query nyangkut tidak boleh menahan koneksi selamanya
      - "statement_timeout=30000"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nusa -d nusaledger"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
